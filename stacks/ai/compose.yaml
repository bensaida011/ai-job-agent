# AI stack: Ollama (runs the AI models) + Open WebUI (optional chat website).
# Start with:  cd /opt/stacks/ai && docker compose up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"   # only reachable from this server (Ollama has no password)
    environment:
      - OLLAMA_KEEP_ALIVE=24h       # keep the model loaded in RAM (no reload delay)
      - OLLAMA_NUM_PARALLEL=1       # one request at a time: best for weak CPUs
    volumes:
      - ollama:/root/.ollama        # downloaded models are stored here
    networks:
      - shared

  open-webui:                       # optional: delete this block on 4 GB machines
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openwebui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - shared

volumes:
  ollama:
  openwebui:

networks:
  shared:
    name: shared                    # other stacks join this network by name
