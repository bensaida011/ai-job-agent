# FIXED APPLICATION ANSWERS (example - replace with your own real answers)
#
# These answers are written by YOU, once, and are never generated by AI.
# The current Job Finder does not read this file. It is prepared for the
# planned "apply" part of the project, which must only ever copy these
# exact answers into application forms, after you approve each application.

personal:
  full_name: "YOUR_FULL_NAME"
  email: "YOUR_EMAIL"
  phone: "YOUR_PHONE"
  location: "YOUR_TOWN, United Kingdom"
  linkedin: "YOUR_LINKEDIN_URL"

eligibility:
  right_to_work_uk: "Yes"            # answer truthfully for your situation
  requires_sponsorship_now: "No"
  requires_sponsorship_future: "No"
  notes: ""                          # e.g. visa type and expiry, if relevant

availability:
  notice_period: "1 week"
  employment_type: "Full-time"
  work_pattern: ["On-site", "Hybrid", "Remote"]
  willing_to_relocate: "Yes, anywhere in the UK"

salary:
  expected_min_gbp: 25000
  expected_max_gbp: 30000

targets:
  job_titles:
    - "SOC Analyst"
    - "Cyber Security Analyst"
    - "IT Security Analyst"
  skip_if_advert_contains:
    - "SC clearance"
    - "DV clearance"

rules:
  min_match_score: 70
  daily_apply_limit: 10
  mode: "approve-first"   # every application needs your explicit approval
